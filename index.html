<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para ti</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<canvas id="espacio" class="espacio" aria-hidden="true"></canvas>
<main>
  <section id="intro" class="intro">
    <p class="para" id="para"></p>
    <h1 id="titulo"></h1>
    <p id="sub" class="sub"></p>
    <button id="partir" class="boton">Comenzar el viaje</button>
  </section>
  <p id="verso" class="verso" aria-live="polite"></p>
  <button id="saltar" class="saltar" hidden>Saltar el viaje</button>
  <section id="campo" class="campo" hidden>
    <p id="llegada" class="llegada"></p>
    <p id="progreso" class="progreso" role="status"></p>
    <p id="final" class="final" hidden></p>
    <div id="flores" class="flores"></div>
    <div id="tarjeta" class="tarjeta" hidden role="dialog" aria-live="polite"><h2 id="tTit"></h2><p id="tTxt"></p><button id="cerrar" class="boton">Seguir</button></div>
  </section>
</main>
<script src="datos.js"></script>
<script src="flores.js"></script>
</body>
</html>
